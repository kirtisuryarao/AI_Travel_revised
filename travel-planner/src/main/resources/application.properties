spring.application.name=travel-planner

# ─── Server ───────────────────────────────────────────────────────
# Railway injects PORT; fallback to 8081 for local development
server.port=${PORT:8081}

# ─── Groq API ────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
# Groq retired llama-3.3-70b-versatile on 2026-08-16; gpt-oss-120b is the replacement
groq.api.model=openai/gpt-oss-120b

# ─── Logging ─────────────────────────────────────────────────────
logging.level.com.lekha.travel_planner=INFO
logging.level.org.springframework.web=WARN

# ─── H2 Database (local dev) ─────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/traveldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JWT ─────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:travel-planner-dev-secret-change-in-production-32chars}
app.jwt.expiration-ms=86400000
